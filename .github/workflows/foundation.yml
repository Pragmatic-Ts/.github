name: Foundation validation
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install YAML parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Validate foundation and planning kit
        run: python3 scripts/validate_foundation.py
      - name: Run validation regressions
        run: node --test tests/foundation.test.mjs
      - name: Lint active workflows and materialized templates
        run: python3 scripts/lint_workflows.py
