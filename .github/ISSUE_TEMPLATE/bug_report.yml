name: Bug report
description: Report a reproducible defect with safe evidence.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include secrets or customer data. Report vulnerabilities privately using SECURITY.md."
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Who is affected and what happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Safe steps and synthetic inputs.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and version
      description: Product version, platform and sanitized diagnostics.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and workaround
      description: Frequency, severity and any known workaround.
